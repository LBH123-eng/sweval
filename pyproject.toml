[project]
name = "sweval"
version = "0.1.0"
description = "One-command SWE-bench Verified benchmark SDK (official mini-SWE-agent + official harness)"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent==2.4.6",
    "swebench==5.0.2",
    "typer>=0.12",
    "pyyaml",
    "pydantic",
]

[project.scripts]
sweval = "sweval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sweval*"]

[tool.setuptools.package-data]
"sweval" = ["profiles/*.yaml"]
